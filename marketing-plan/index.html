<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketing Plan — SGM Hub</title>
<style>
  :root{
    --bg: #070710;
    --card: #13132a;
    --border: rgba(255,255,255,0.14);
    --accent: #f97316;
    --accent2: #fb923c;
    --text: #f1f1f4;
    --muted: #9a9ab0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;}
  #gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .gate-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:40px 36px;
    max-width:380px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  .gate-card h1{
    font-size:20px;
    margin:0 0 8px;
    letter-spacing:0.02em;
  }
  .gate-card p{
    color:var(--muted);
    font-size:13px;
    margin:0 0 24px;
    line-height:1.5;
  }
  .gate-card input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0e0e1c;
    color:var(--text);
    font-size:14px;
    margin-bottom:14px;
    outline:none;
  }
  .gate-card input:focus{border-color:var(--accent);}
  .gate-card button{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#12100a;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .gate-card button:hover{opacity:0.92;}
  #err{
    color:#ef4444;
    font-size:12px;
    margin-top:12px;
    min-height:16px;
  }
  #content{
    display:none;
    height:100vh;
    width:100%;
  }
  #content iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
  }
  .back-link{
    display:inline-block;
    margin-top:18px;
    font-size:12px;
    color:var(--muted);
    text-decoration:none;
  }
  .back-link:hover{color:var(--text);}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1>Marketing Plan — Restricted</h1>
    <p>This page is password protected. Enter the access password to view the SGM Tournament Marketing Playbook.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="off" />
    <button id="submitBtn">Unlock</button>
    <div id="err"></div>
    <a class="back-link" href="/">Back to SGM Hub</a>
  </div>
</div>

<div id="content">
  <iframe src="/_2sgm-tournament-marketing-playbook.html" title="SGM Tournament Marketing Playbook"></iframe>
</div>

<script>
  var PASSWORD = "SGM2026!";
  var pwInput = document.getElementById('pw');
  var err = document.getElementById('err');

  function tryUnlock(){
    if(pwInput.value === PASSWORD){
      document.getElementById('gate').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      try{ sessionStorage.setItem('sgm-marketing-plan-unlocked','1'); }catch(e){}
    } else {
      err.textContent = 'Incorrect password. Please try again.';
      pwInput.value = '';
      pwInput.focus();
    }
  }

  document.getElementById('submitBtn').addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') tryUnlock();
  });

  try{
    if(sessionStorage.getItem('sgm-marketing-plan-unlocked') === '1'){
      document.getElementById('gate').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    }
  }catch(e){}
</script>

</body>
</html>
